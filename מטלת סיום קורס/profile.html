<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרופיל משתמש</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-light-green">
    <main class="min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="container" style="max-width: 700px;">
            <div class="card card-soft-light shadow-lg border-0 overflow-hidden">
                <div class="card-body p-4 p-md-5 text-center">
                    
                    <div class="mb-4">
                        <img id="displayImage" src="" alt="תמונת פרופיל" class="rounded-circle img-thumbnail shadow mb-3" style="width: 150px; height: 150px; object-fit: cover;">
                        <h2 id="displayFullName" class="h3 mb-1">טוען נתונים...</h2>
                        <p id="displayUsername" class="text-muted">@username</p>
                    </div>

                    <hr class="my-4">

                    <div class="row text-start g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <strong>אימייל:</strong> <span id="displayEmail" class="text-secondary"></span>
                        </div>
                        <div class="col-12 col-md-6">
                            <strong>תאריך לידה:</strong> <span id="displayBirthDate" class="text-secondary"></span>
                        </div>
                        <div class="col-12 col-md-6">
                            <strong>עיר:</strong> <span id="displayCity" class="text-secondary"></span>
                        </div>
                        <div class="col-12 col-md-6">
                            <strong>כתובת:</strong> <span id="displayAddress" class="text-secondary"></span>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                        <a href="edit-profile.html" class="btn btn-outline-light-green btn-lg flex-grow-1">עריכת פרטים</a>
                        <a href="game.html" class="btn btn-light-green btn-lg flex-grow-1">אל המשחק (Battleship)</a>
                        <button id="logoutBtn" class="btn btn-danger btn-lg flex-grow-1">התנתק</button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script type="module" src="script/profile.js"></script>
</body>
</html>
