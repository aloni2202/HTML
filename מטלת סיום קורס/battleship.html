<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Game</title>
    <link rel="stylesheet" href="style/battleshipstyle.css">
    <script src="script/battleshipMain.js" type="module" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="container">
        <h1>משחק צוללות - Battleship</h1>

        <!-- מסך הגדרות -->
        <div id="setup-container">
            <h3>הגדרות לוח וספינות</h3>
            <div class="form-group">
                <label for="grid-size">בחר גודל לוח המשחק:</label>
                <select id="grid-size">
                    <option value="10">10 X 10</option>
                    <option value="11">11 X 11</option>
                    <option value="12">12 X 12</option>
                    <option value="13">13 X 13</option>
                    <option value="14">14 X 14</option>
                    <option value="15">15 X 15</option>
                </select>
            </div>

            <div class="ships-input">
                <p>הזן כמות ספינות קרב מכל גודל (2 עד 5):</p>
                <div class="input-row"><label for="ship-size-2">ספינה בגודל 2:</label> <input type="number" id="ship-size-2" min="0" value="1"></div>
                <div class="input-row"><label for="ship-size-3">ספינה בגודל 3:</label> <input type="number" id="ship-size-3" min="0" value="1"></div>
                <div class="input-row"><label for="ship-size-4">ספינה בגודל 4:</label> <input type="number" id="ship-size-4" min="0" value="1"></div>
                <div class="input-row"><label for="ship-size-5">ספינה בגודל 5:</label> <input type="number" id="ship-size-5" min="0" value="1"></div>
            </div>

            <button id="start-game-btn" class="primary-btn">התחל משחק</button>
        </div>

        <!-- מסך המשחק -->
        <div id="game-container" class="hidden">
            <div id="board-grid"></div>

            <div id="stats-sidebar">
                <table class="stats-table">
                    <thead>
                        <tr class="table-header-main">
                            <th colspan="2">ספינות שנותרו ליריב:</th>
                        </tr>
                        <tr class="table-header-sub">
                            <th>סוג ספינה</th>
                            <th>כמות שנשארה</th>
                        </tr>
                    </thead>
                    <tbody id="ships-table-body">
                    </tbody>
                </table>

                <button id="back-to-profile-btn" class="secondary-btn">חזרה לפרופיל 👤</button>
            </div>
        </div>
    </div>
</body>

</html>
