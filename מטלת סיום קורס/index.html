<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת סטודנטים - התחברות</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <main class="card" role="main">
        <div class="brand" style="justify-content: center; margin-bottom: 24px;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="24" height="24" rx="5" fill="#0f3b66"/>
                <path d="M7 14h10v2H7z" fill="#fff" opacity="0.9"/>
            </svg>
            <h1>ברוכים הבאים</h1>
        </div>

        <div id="errorMsg" style="color: #e53e3e; font-weight: bold; margin-bottom: 15px; text-align: center;"></div>

        <form id="loginForm" novalidate>
            <div style="margin-bottom: 16px">
                <label for="username">שם משתמש</label>
                <input id="username" name="username" type="text" placeholder="הקלידו שם משתמש" autocomplete="username" required>
            </div>

            <div style="margin-bottom: 12px">
                <label for="password">סיסמה</label>
                <input id="password" name="password" type="password" placeholder="הקלידו סיסמה" autocomplete="current-password" required>
            </div>

            <div style="margin-top: 20px">
                <button id="loginBtn" class="btn" type="submit">התחברות</button>
            </div>

            <p class="helper" style="margin-top: 20px;">
                עדיין אין לכם חשבון? <a href="RegistrationForm.html">להרשמה לחצו כאן</a> 
            </p>
        </form>
    </main>
    <script type="module" src="script/main.js"></script>  
</body>
</html>
